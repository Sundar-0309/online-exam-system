<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white">
            <h2 class="h4 mb-0">Edit Student Details</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/student/update/{id}(id=${student.id})}" method="post">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Student Name</label>
                    <input type="text" class="form-control" id="fullName" name="fullName"
                           th:value="${student.fullName}" maxlength="255" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           th:value="${student.username}" maxlength="255" required>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/admin/students}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
