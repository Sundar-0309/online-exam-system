<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Student Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
    <div class="pb-3 mb-4 border-bottom d-flex align-items-center">
        <i class="bi bi-bar-chart-line-fill me-3" style="font-size: 2.5rem; color: #0dcaf0;"></i>
        <div>
            <h2 class="mb-0">All Student Results</h2>
            <p class="text-muted mb-0">Review exam marks, percentages, and completion status.</p>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/admin/results}" method="get" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="studentId" class="form-label">Student</label>
                    <select id="studentId" name="studentId" class="form-select">
                        <option value="">All students</option>
                        <option th:each="student : ${students}" th:value="${student.id}"
                                th:text="|${student.fullName} (${student.username})|"
                                th:selected="${selectedStudentId != null and selectedStudentId == student.id}">
                            Student
                        </option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="examId" class="form-label">Exam</label>
                    <select id="examId" name="examId" class="form-select">
                        <option value="">All exams</option>
                        <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.title}"
                                th:selected="${selectedExamId != null and selectedExamId == exam.id}">
                            Exam
                        </option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/admin/results}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div th:if="${#lists.isEmpty(results)}" class="card-body">
            <div class="alert alert-info mb-0">No exam results match the selected filters.</div>
        </div>
        <div th:unless="${#lists.isEmpty(results)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Student Name</th>
                    <th>Username</th>
                    <th>Exam</th>
                    <th>Marks</th>
                    <th>Percentage</th>
                    <th>Exam Status</th>
                    <th>Submission Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="result : ${results}">
                    <td th:text="${result.student.fullName}">Student Name</td>
                    <td th:text="${result.student.username}">student01</td>
                    <td th:text="${result.exam.title}">Exam</td>
                    <td>
                        <span th:text="${result.scoreAchieved}">0</span> /
                        <span th:text="${result.totalMarks}">0</span>
                    </td>
                    <td>
                        <span th:if="${result.totalMarks > 0}"
                              th:text="${#numbers.formatDecimal((result.scoreAchieved * 100.0) / result.totalMarks, 1, 1) + '%'}">
                            0.0%
                        </span>
                        <span th:if="${result.totalMarks == 0}" class="text-muted">N/A</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${result.completionStatus == 'TERMINATED' ? 'bg-danger' : (result.completionStatus == 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-success')}"
                              th:text="${result.completionStatus == 'TERMINATED' ? 'Terminated' : (result.completionStatus == 'IN_PROGRESS' ? 'In progress' : 'Completed')}">
                            Completed
                        </span>
                    </td>
                    <td>
                        <span th:if="${result.submissionTime != null}"
                              th:text="${#temporals.format(result.submissionTime, 'dd-MMM-yyyy HH:mm')}">
                            25-Oct-2025 14:30
                        </span>
                        <span th:if="${result.submissionTime == null}">In progress</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
